[TELEGRAMHELP]
HEADER="Telegram notifications"
INTRO="In addition to email, LoxBerry can send its notifications to your phone via Telegram. You need your own Telegram bot for this. No port forwarding is required: LoxBerry only opens an outgoing connection to the Telegram servers."
BOT_HEADER="Create a bot"
BOT_STEP1="<b>1.</b> In the Telegram app, open the chat with <b>@BotFather</b> (the official bot for creating bots) and send <b>/newbot</b>."
BOT_STEP2="<b>2.</b> Choose a name and a username for the bot (the username must end with <i>bot</i>). BotFather replies with the <b>bot token</b>, e.g. 123456789:ABC…. Treat the token like a password."
BOT_STEP3="<b>3.</b> Enter the token in the <b>Bot token</b> field here and save. If <i>Connected to bot @…</i> appears below it, the token is correct."
CHATID_HEADER="Recipients and chat ID"
CHATID_TEXT="Open your new bot in Telegram and send it any message. Then click <b>Find chat ID</b> and <b>Use</b>. The chat ID of a person consists of digits only. As long as another program queries the same bot (e.g. the <b>MQTT2Telegram</b> plugin with its return channel), <b>Find chat ID</b> does not work – read the chat ID there or pause that program for a moment."
GROUP_TEXT="For a <b>group</b>, add the bot to the group and write a message there. The chat ID of a group starts with a minus sign. You can add several recipients, each one receives every message."
NOTIFY_HEADER="What is sent?"
NOTIFY_TEXT="With the switches you decide whether <b>system errors</b>, <b>system infos</b>, <b>plugin errors</b> and <b>plugin infos</b> are sent via Telegram. This is independent of the mail settings."
TEST_TEXT="The <b>Send test message</b> button uses the saved settings. Save first, then send the test. For each recipient you see whether delivery worked."
PLUGIN_HEADER="MQTT and camera images"
PLUGIN_TEXT="This page only sends LoxBerry notifications. If you want to forward MQTT messages via Telegram, optionally with a camera image, install the <b>MQTT2Telegram</b> plugin."
