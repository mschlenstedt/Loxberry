[TELEGRAMHELP]
HEADER="Telegram-Benachrichtigungen"
INTRO="LoxBerry kann seine Benachrichtigungen zusätzlich zur E-Mail per Telegram auf dein Handy schicken. Dafür brauchst du einen eigenen Telegram-Bot. Es ist keine Portfreigabe im Router nötig: LoxBerry baut nur eine ausgehende Verbindung zu den Telegram-Servern auf."
BOT_HEADER="Bot anlegen"
BOT_STEP1="<b>1.</b> Öffne in der Telegram-App den Chat mit <b>@BotFather</b> (der offizielle Bot zum Anlegen von Bots) und sende <b>/newbot</b>."
BOT_STEP2="<b>2.</b> Vergib einen Namen und einen Benutzernamen für den Bot (der Benutzername muss auf <i>bot</i> enden). Der BotFather antwortet mit dem <b>Bot-Token</b>, z. B. 123456789:ABC…. Behandle den Token wie ein Passwort."
BOT_STEP3="<b>3.</b> Trage den Token hier im Feld <b>Bot-Token</b> ein und speichere. Steht darunter <i>Verbunden mit Bot @…</i>, ist der Token richtig."
CHATID_HEADER="Empfänger und Chat-ID"
CHATID_TEXT="Öffne in Telegram deinen neuen Bot und schreibe ihm eine beliebige Nachricht. Klicke dann auf <b>Chat-ID ermitteln</b> und auf <b>Übernehmen</b>. Die Chat-ID einer Person besteht nur aus Ziffern. Solange ein anderes Programm denselben Bot abfragt (z. B. das Plugin <b>MQTT2Telegram</b> mit Rückkanal), funktioniert <b>Chat-ID ermitteln</b> nicht – lies die Chat-ID dann dort ab oder pausiere das Programm kurz."
GROUP_TEXT="Für eine <b>Gruppe</b> füge den Bot zur Gruppe hinzu und schreibe dort eine Nachricht. Die Chat-ID einer Gruppe beginnt mit einem Minuszeichen. Du kannst mehrere Empfänger eintragen, jeder bekommt jede Nachricht."
NOTIFY_HEADER="Was wird gesendet?"
NOTIFY_TEXT="Mit den Schaltern legst du fest, ob <b>Systemfehler</b>, <b>Systeminfos</b>, <b>Pluginfehler</b> und <b>Plugininfos</b> per Telegram kommen. Die Einstellung ist unabhängig von der Mail."
TEST_TEXT="Der Knopf <b>Testnachricht senden</b> verwendet die gespeicherten Einstellungen. Speichere also zuerst und sende dann den Test. Pro Empfänger wird angezeigt, ob die Zustellung geklappt hat."
PLUGIN_HEADER="MQTT und Kamerabilder"
PLUGIN_TEXT="Diese Seite verschickt nur LoxBerry-Benachrichtigungen. Willst du MQTT-Nachrichten per Telegram weiterleiten, auch mit Kamerabild, installiere das Plugin <b>MQTT2Telegram</b>."
