[TIMESERVER]
INTRO_HEADER="About System Time"
INTRO_TEXT1="In the System Time widget you set which time server LoxBerry uses, how often it syncs its clock and which timezone applies. The sync itself is done by DietPi; LoxBerry hands the settings over to DietPi. With <i>Continuously</i> DietPi corrects deviations gradually, with the other settings the clock is set at the given times."
NTPSERVER_TEXT1="As NTP server you can enter one or more servers, separated by spaces. For pool.ntp.org servers the domain without the leading number is enough, e.g. <i>uk.pool.ntp.org</i>; DietPi adds the servers 0 to 3 itself. <i>gateway</i> uses your router as time server, <i>default</i> the server provided via DHCP. If no sync is possible with a new server, the previous one is kept."
NTPSERVER_TEXT2="You can refresh the requested time with the <i>refresh</i> button. To debug problems with LoxBerry time or timezone, open the <i>Log File</i>."
