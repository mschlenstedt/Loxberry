
[TIMESERVER]
INTRO_HEADER="Über Systemzeit"
INTRO_TEXT1="Im Systemzeit-Widget stellst du ein, mit welchem Zeitserver und wie oft der LoxBerry seine Uhrzeit abgleicht und welche Zeitzone gilt. Den Abgleich selbst übernimmt DietPi, LoxBerry übergibt ihm die Einstellungen. Bei <i>Laufend</i> gleicht DietPi Abweichungen allmählich aus, bei den anderen Einstellungen wird die Uhr zum jeweiligen Zeitpunkt gestellt."
NTPSERVER_TEXT1="Als NTP-Server kannst du einen oder mehrere Server eintragen, getrennt durch Leerzeichen. Bei pool.ntp.org-Servern genügt die Domain ohne führende Ziffer, z. B. <i>de.pool.ntp.org</i>; die Server 0 bis 3 ergänzt DietPi selbst. Mit <i>gateway</i> dient der Router als Zeitserver, mit <i>default</i> der Server aus DHCP. Kommt mit einem neuen Server keine Synchronisation zustande, bleibt der bisherige eingestellt."
NTPSERVER_TEXT2="Du kannst  mit dem <i>Aktualisieren</i>-Symbol die Zeit neu abrufen lassen. Um Fehler bei der Zeit oder der Zeitzone zu ermitteln, öffne das Protokoll mit der <i>Log file</i>-Schaltfläche."
