include_path=".:${LBHOMEDIR}/libs/phplib"
error_log = ${LBSTMPFSLOG}/apache2/php.log
; Not used by LoxBerry, mitigates PHP2Shell (CVE-2026-109618/-109619)
session.upload_progress.enabled = Off
; Uploads through the web interface (#1619). PHP's defaults (2M / 8M) cannot be
; raised by a plugin: both are PHP_INI_PERDIR. Uploads are written to /tmp
; (tmpfs), not loaded into memory_limit.
upload_max_filesize = 64M
post_max_size = 72M

