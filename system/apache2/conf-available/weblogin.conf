# Experimental, opt-in browser login. NOT linked in conf-enabled by default.
# See testing/WEBLOGIN.md before enabling. Requires mod_perl and DBD::SQLite.
# Set LBLOGINORIGIN to your canonical HTTPS URL, including a custom port if used:
#   Define LBLOGINORIGIN https://loxberry.example:443
# Use the origin as shown by the browser (omit the default :443).
PerlSwitches -I${LBHOMEDIR}/libs/perllib
PerlModule LoxBerry::WebLogin::Apache
PerlSetVar WebLoginHome ${LBHOMEDIR}
PerlSetVar WebLoginOrigin ${LBLOGINORIGIN}
SetEnv LOXBERRY_FORM_LOGIN 1

# Location matching also covers the proxied terminal, both aliases, and plugins.
# Basic requests continue through the original Apache auth provider. Cookie-only
# requests use a distinct AuthType so native Basic Auth never races the handler.
<LocationMatch "^/(admin|auth)(/|$)">
    PerlAccessHandler LoxBerry::WebLogin::Apache::access
    PerlAuthenHandler LoxBerry::WebLogin::Apache::authenticate
    <If "-z req('Authorization') && req('Cookie') =~ /(^|;[[:space:]]*)__Host-LBSession=/">
        AuthType LoxBerrySession
    </If>
</LocationMatch>

<LocationMatch "^/(index\.html|login(/logout)?)?$">
    SetHandler modperl
    PerlResponseHandler LoxBerry::WebLogin::Apache::page
    AuthType None
    Require all granted
    LimitRequestBody 4096
</LocationMatch>
